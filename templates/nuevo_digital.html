{% extends "base.html" %}

{% block titulo %}Nuevo Producto Digital — Tienda Online{% endblock %}

{% block content %}
<div class="container py-4">
    <a href="{{ url_for('inicio') }}" class="btn btn-outline-secondary mb-3">← Volver al catálogo</a>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
            <h2 class="mb-4">💾 Nuevo Producto Digital</h2>

            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Código</label>
                    <input type="text" class="form-control" name="codigo" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre</label>
                    <input type="text" class="form-control" name="nombre" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Precio base ($)</label>
                        <input type="number" step="0.01" class="form-control" name="precio_base" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Stock inicial</label>
                        <input type="number" class="form-control" name="stock" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tipo de licencia</label>
                    <select class="form-select" name="licencia" required>
                        <option value="personal">Personal</option>
                        <option value="comercial">Comercial</option>
                        <option value="educativa">Educativa</option>
                    </select>
                </div>

                <!-- Campo para subida de imagen -->
                <div class="mb-4">
                    <label for="imagen" class="form-label fw-semibold">Imagen del Producto</label>
                    <input type="file" class="form-control" name="imagen" accept="image/*">
                    <small class="text-muted">Si no seleccionas un archivo, se usará la imagen predeterminada.</small>
                </div>

                <button type="submit" class="btn btn-primary">Crear producto</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
