{% extends "base.html" %}

{% block titulo %}Crear Cuenta{% endblock %}

{% block content %}
    <div class="row justify-content-center py-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <h2 class="mb-4">Crear Cuenta</h2>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre completo</label>
                            <input type="text" class="form-control" name="nombre" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Correo electrónico</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" name="password" minlength="6" required>
                        </div>

                        <!-- Selector de Rol -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Rol del usuario</label>
                            <select class="form-select" name="rol" required>
                                <option value="cliente" selected>Cliente</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Registrarme</button>
                    </form>

                    <p class="text-center mt-3 mb-0 text-muted">
                        ¿Ya tienes cuenta?
                        <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
